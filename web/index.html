<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>导演工作台</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand"><span class="mark">导</span><span>工作台</span></div>
      <div class="crumb">
        <span id="ws-label">未打开工作目录</span><i>/</i>
        <select id="scene-select" disabled></select>
      </div>
      <span class="spacer"></span>
      <span id="save-state"></span>
      <button class="icon-btn" id="btn-workspace" title="打开工作目录"><svg viewBox="0 0 16 16" width="14" height="14"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h3l1.2 1.4a1 1 0 0 0 .7.3h4.1A1.5 1.5 0 0 1 14 6.2v5.3a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5v-7z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <button class="icon-btn" id="btn-newscene" disabled title="新建场景"><svg viewBox="0 0 16 16" width="14" height="14"><path d="M3.5 2.5h6L12 5v8.5h-8.5v-11z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M9.5 2.5V5H12M8 7.5v4M6 9.5h4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
      <button class="icon-btn" id="btn-undo" disabled title="撤销 (⌘Z)"><svg viewBox="0 0 16 16" width="14" height="14"><path d="M3.5 6.5h6a3.5 3.5 0 1 1 0 7h-2M3.5 6.5 6 4M3.5 6.5 6 9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="icon-btn" id="btn-redo" disabled title="重做 (⇧⌘Z)"><svg viewBox="0 0 16 16" width="14" height="14"><path d="M12.5 6.5h-6a3.5 3.5 0 1 0 0 7h2M12.5 6.5 10 4m2.5 2.5L10 9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="icon-btn" id="btn-export-fb" disabled title="导出导演反馈为 agent 任务"><svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 10.5V2.5M5.5 8 8 10.5 10.5 8M3 12.5v1h10v-1" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </header>

    <main id="main">
      <aside id="script-panel">
        <div class="panel-head">
          <span>台本</span>
          <span class="h-actions">
            <button class="btn" id="btn-import-script" title="导入 script.json">导入</button>
            <button class="btn" id="btn-gendraft" title="从台本重建 draft clips">生成预演</button>
          </span>
        </div>
        <div id="script-lines"></div>
        <div class="panel-foot">
          <button class="btn" id="btn-addline"><svg viewBox="0 0 16 16" width="11" height="11" style="vertical-align:-1px"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg> 台词</button>
        </div>
      </aside>

      <section id="stage-wrap">
        <div id="stage">
          <canvas id="cv" width="960" height="540"></canvas>
          <video id="vid" playsinline muted style="display:none"></video>
          <div id="stage-hud"></div>
        </div>
        <div id="transport">
          <button id="btn-play" title="播放/暂停 (空格)"><svg id="ic-play" viewBox="0 0 16 16" width="13" height="13"><path d="M5 3.5v9l7-4.5z" fill="currentColor"/></svg></button>
          <span id="tc">0:00.0 / 0:00.0</span>
          <input id="scrub" type="range" min="0" max="1000" value="0" />
          <button class="btn" id="btn-mark" title="在此位置添加批注 (M)"><svg viewBox="0 0 16 16" width="12" height="12" style="vertical-align:-1px"><path d="M11.5 2.5l2 2L6 12H4v-2l7.5-7.5z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg> 批注</button>
          <span id="view-mode"></span>
        </div>
      </section>

      <aside id="right-panel">
        <div class="segs">
          <button class="opt on" data-tab="voice">配音</button>
          <button class="opt" data-tab="feedback">批注</button>
          <button class="opt" data-tab="props">片段</button>
        </div>

        <div class="tabpage" id="tab-voice">
          <div class="row">
            <button class="btn action" id="btn-rec"><svg viewBox="0 0 16 16" width="12" height="12" style="vertical-align:-1.5px"><rect x="5.5" y="2" width="5" height="8" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3 8a5 5 0 0 0 10 0M8 13v2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg> 录音</button>
            <button class="btn" id="btn-import-take" title="导入已有 wav 作为 take">导入音频</button>
            <span id="rec-state"></span>
          </div>
          <div class="row small">对照左侧台本朗读；录音存到 audio/rec/。</div>
          <div class="sec-label">Takes</div>
          <div id="take-list"></div>
          <div class="row">
            <button class="btn action" id="btn-analyze" disabled>ASR 对齐台本</button>
            <button class="btn" id="btn-render" disabled>渲染配音</button>
          </div>
          <div class="row small" id="model-state"></div>
          <div class="sec-label">对齐</div>
          <div id="asr-table"></div>
        </div>

        <div class="tabpage hidden" id="tab-feedback">
          <div class="row">
            <input id="fb-kind" list="fb-kinds" placeholder="类型：logic / pacing / visual" />
            <datalist id="fb-kinds">
              <option value="logic">剧情逻辑</option>
              <option value="pacing">节奏</option>
              <option value="visual">画面</option>
              <option value="audio">音频</option>
              <option value="other">其他</option>
            </datalist>
          </div>
          <textarea id="fb-text" rows="3" placeholder="在当前播放位置描述问题…"></textarea>
          <div class="row" style="margin-top:6px">
            <button class="btn action" id="btn-fb-add">在当前位置加批注</button>
            <button class="icon-btn" id="btn-fb-voice" title="录语音批注"><svg viewBox="0 0 16 16" width="13" height="13"><rect x="5.5" y="2" width="5" height="8" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3 8a5 5 0 0 0 10 0M8 13v2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
          </div>
          <div class="sec-label">记录</div>
          <div id="fb-list"></div>
        </div>

        <div class="tabpage hidden" id="tab-props">
          <div id="clip-props"></div>
        </div>
      </aside>
    </main>

    <footer id="timeline">
      <div class="tl-lane-label">视频</div>
      <div id="tl-video" class="tl-lane"></div>
      <div class="tl-lane-label">音频</div>
      <div id="tl-audio" class="tl-lane"></div>
    </footer>
  </div>
  <script type="module" src="/src/app.ts"></script>
</body>
</html>
